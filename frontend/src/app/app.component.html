        1.28 0 -1.28 0 -0.25
        1.28 0 -1.28 0 -0.25
        1.28 0 -1.28 0 -0.25
        0 0 0 1 0" />
      <feColorMatrix type="matrix" values="
        0.603922 0 0 0 0.388235
       -0.125490 0 0 0 0.517647
       -0.643137 0 0 0 0.654902
        0 0 0 1 0" />
    </filter>
  </defs>
</svg>
