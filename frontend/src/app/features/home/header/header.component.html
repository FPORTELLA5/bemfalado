<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/" aria-label="BemFalado — página inicial" (click)="closeMobileMenu()">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" role="img">
          <path d="M8 28.5C8 15.52 18.52 5 31.5 5S55 15.52 55 28.5 44.48 52 31.5 52c-4.12 0-7.98-1.06-11.34-2.92L7 59l3.42-14.23A23.34 23.34 0 0 1 8 28.5Z" stroke="#26364A" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19 30.5c3.15 5.05 7.25 7.58 12.3 7.58 5.05 0 9.15-2.53 12.3-7.58" stroke="#F15A24" stroke-width="5.4" stroke-linecap="round"/>
          <path d="m48 8 2.4-5.5M56 15l5-3.2M54 5l1-4" stroke="#F15A24" stroke-width="3.8" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-name"><span class="brand-name-first">Bem</span><span class="brand-name-second">Falado</span></span>
    </a>

    <nav class="desktop-nav" aria-label="Navegação principal">
      <a href="/#categorias">Categorias</a>
      <a href="/como-funciona">Como funciona</a>
      <a href="/sobre">Sobre</a>
    </nav>

    <div class="header-actions">
      <label class="theme-control">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.64 5.64l1.42 1.42m9.88 9.88 1.42 1.42m0-11.32-1.42 1.42m-9.88 9.88-1.42 1.42"/><circle cx="12" cy="12" r="4"/></svg>
        <span class="sr-only">Tema da interface</span>
        <select aria-label="Tema da interface" [value]="themePreference()" (change)="onThemeChange($event)">
          <option value="system">Automático</option>
          <option value="light">Claro</option>
          <option value="dark">Escuro</option>
        </select>
      </label>
      <a class="login-link" href="/entrar">Entrar</a>
      <a class="button button-small button-primary header-cta" href="/criar-conta">Criar conta</a>
      <button class="mobile-menu-button" type="button" (click)="toggleMobileMenu()" [attr.aria-expanded]="mobileMenuOpen()" aria-controls="mobile-navigation" aria-label="Abrir menu">
        @if (mobileMenuOpen()) {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
        }
      </button>
    </div>
  </div>
  @if (mobileMenuOpen()) {
    <nav class="mobile-nav" id="mobile-navigation" aria-label="Navegação móvel">
      <a href="/#categorias" (click)="closeMobileMenu()">Categorias</a>
      <a href="/como-funciona" (click)="closeMobileMenu()">Como funciona</a>
      <a href="/sobre" (click)="closeMobileMenu()">Sobre</a>
      <a href="/entrar" (click)="closeMobileMenu()">Entrar</a>
      <a href="/criar-conta" (click)="closeMobileMenu()">Criar conta</a>
    </nav>
  }
</header>
