<section class="hero">
  <div class="container hero-grid">
    <div class="hero-content">
      <p class="hero-eyebrow"><span class="hero-eyebrow-mark" aria-hidden="true">✳</span> O lado bom de descobrir</p>
      <h1>Descubra lugares que fazem <em>bem falar.</em></h1>
      <p class="hero-description">Encontre negócios recomendados por quem já viveu a experiência.</p>

      <form class="search-panel" (submit)="onSearchSubmit($event)">
        <label class="search-field search-main-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
          <span class="sr-only">O que você procura?</span>
          <input id="search-input" type="search" placeholder="Lugar, empresa ou serviço" [value]="searchTerm()" (input)="onSearchTermInput($event)">
        </label>
        <span class="search-divider" aria-hidden="true"></span>
        <label class="search-field location-field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.2"/></svg>
          <span class="sr-only">Cidade ou região</span>
          <input type="text" placeholder="Cidade ou bairro" [value]="locationTerm()" (input)="onLocationInput($event)">
        </label>
        <button class="button button-primary search-submit" type="submit">Buscar <span aria-hidden="true">→</span></button>
      </form>
      @if (searchFeedback()) {
        <p class="search-feedback" role="status" aria-live="polite">{{ searchFeedback() }}</p>
      }
      <p class="hero-footnote"><span aria-hidden="true">✓</span> Explore sem criar uma conta.</p>
    </div>

    <div class="hero-art" aria-hidden="true">
      <div class="hero-art-orbit"></div>
      <div class="hero-brand-card">
        <img class="hero-official-logo" src="assets/branding/logo-bemfalado.png" alt="" />
        <span class="hero-brand-caption">Boas experiências merecem circular.</span>
      </div>
      <span class="hero-sticker hero-sticker-top">Só boas experiências</span>
      <span class="hero-sticker hero-sticker-bottom">Espalhe o que é bom ✦</span>
      <span class="hero-art-dot hero-art-dot-one"></span>
      <span class="hero-art-dot hero-art-dot-two"></span>
    </div>
  </div>
</section>
